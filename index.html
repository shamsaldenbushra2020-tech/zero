<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <title>لقمة بلدنا</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #fff;
      color: #222;
     font-family: 'Cairo', sans-serif; 
    }
    button, input, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    :root {
      --o: #d95700;
      --line: #e5e7eb;
      --muted: #777;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 20px 12px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
    }
    .brand h1 {
      margin: 0;
      color: var(--o);
      font-size: 31px;
    }
    .brand p {
      margin: 5px 0;
      color: #777;
      font-size: 14px;
    }

    /* Categories & Search */
    .categories {
      display: flex;
      gap: 10px;
      overflow: auto;
      padding: 0 30px 15px;
      max-width: 1180px;
      margin: auto;
    }
    .cat {
      min-width: 120px;
      height: 52px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
    }
    .cat.active {
      background: var(--o);
      border-color: var(--o);
      color: #fff;
    }
    .search {
      max-width: 1180px;
      margin: 0 auto 20px;
      padding: 0 30px;
    }
    .searchbox {
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 11px;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }
    .searchbox input {
      width: 100%;
      border: 0;
      outline: 0;
    }
    .searchbox span {
      font-size: 24px;
    }

    /* Products Grid */
    .page {
      max-width: 1180px;
      margin: auto;
      padding: 0 30px 140px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .card {
      border: 1px solid #e9e9e9;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px #00000009;
      position: relative;
    }
    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }
    .favorite {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 38px;
      height: 38px;
      border: 1px solid #eee;
      border-radius: 50%;
      background: #fff;
      color: var(--o);
      font-size: 23px;
    }
    .cardbody {
      padding: 13px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }
    .cardrow {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price {
      font-size: 18px;
      font-weight: 700;
      color: var(--o);
    }
    .add {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      background: var(--o);
      color: #fff;
      font-size: 28px;
    }

    /* Cart Widget & Sheet */
    .floating-cart {
      position: fixed;
      top: 24px;
      left: 25px;
      width: 61px;
      height: 61px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 5px 18px #0002;
      z-index: 30;
      font-size: 28px;
    }
    .cart-count {
      position: absolute;
      top: -2px;
      right: -1px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e22;
      color: #fff;
      font-size: 12px;
      display: grid;
      place-items: center;
      font-weight: bold;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: #0004;
      display: none;
      z-index: 40;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: transparent;
      display: none;
      z-index: 100;
    }
    .overlay.open {
      display: block;
    }
    .cart-sheet {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 105%);
      width: min(920px, 100%);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -10px 35px #0003;
      transition: .25s;
    }
    .cart-sheet.open {
      transform: translate(-50%, 0);
    }
    .handle {
      width: 70px;
      height: 5px;
      background: #ddd;
      border-radius: 20px;
      margin: 10px auto;
    }
    .cart-head {
      display: flex;
      justify-content: center;
      position: relative;
      padding: 10px 28px 16px;
    }
    .cart-head h2 {
      margin: 0;
      font-size: 22px;
    }
    .cart-head h2 span {
      color: var(--o);
    }
    .close {
      position: absolute;
      right: 20px;
      top: 7px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: #f5f6f7;
      font-size: 27px;
    }
    .cart-list {
      padding: 0 28px;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto 36px;
      gap: 15px;
      align-items: center;
      border: 1px solid #e6e8eb;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .cart-item img {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      object-fit: cover;
    }
    .cart-item h4 {
      margin: 0 0 6px;
    }
    .trash {
      border: 0;
      background: #fff;
      color: #f21f2b;
      font-size: 23px;
    }
    .qty {
      display: flex;
      border: 1px solid #e0e2e5;
      border-radius: 9px;
      overflow: hidden;
      width: max-content;
    }
    .qty button {
      width: 35px;
      height: 34px;
      border: 0;
      background: #fff;
    }
    .qty span {
      width: 30px;
      text-align: center;
      padding-top: 8px;
    }

    /* Delivery & Checkout */
    .delivery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      padding: 20px 28px 12px;
    }
    .choice {
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .choice.selected {
      border-color: var(--o);
      background: #fff9f5;
    }
    .check {
      width: 24px;
      height: 24px;
      border: 2px solid #aaa;
      border-radius: 5px;
      text-align: center;
    }
    .selected .check {
      background: var(--o);
      border-color: var(--o);
      color: #fff;
    }
    .fee {
      margin: 0 28px 15px;
      padding: 13px;
      background: #f1f7ff;
      color: #1755a1;
      border-radius: 10px;
    }
    .totalbar {
      border-top: 1px solid #eee;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .totalbar strong {
      font-size: 25px;
      color: #15943b;
    }
    .checkout, .send {
      height: 52px;
      border: 0;
      border-radius: 10px;
      background: var(--o);
      color: #fff;
      padding: 0 30px;
      font-weight: bold;
    }

    /* Modal Structure */
    .modal-overlay {
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      position: relative;
      z-index: 110;
      width: min(470px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 35px #0003;
    }
    .modal h3 {
      margin: 0 0 20px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 7px;
    }
    .field input, .field textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      outline: 0;
    }
    .field input {
      height: 48px;
    }
    .field textarea {
      min-height: 90px;
    }
    .location {
      display: none;
    }
    .location.open {
      display: block;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .actions button {
      flex: 1;
      height: 48px;
      border: 0;
      border-radius: 10px;
    }
    .cancel {
      background: #f2f3f4;
    }

    /* Logo Placeholder & Media Queries */
    .logo-placeholder {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: transparent;
    }

    @media (max-width: 760px) {
      .brand img {
        width: 58px;
        height: 58px;
      }
      .brand h1 {
        font-size: 26px;
      }
      .categories, .search, .page {
        padding-left: 14px;
        padding-right: 14px;
      }
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
      }
      .card img {
        height: 135px;
      }
      .cardbody {
        padding: 10px;
      }
      .card h3 {
        font-size: 14px;
      }
      .price {
        font-size: 15px;
      }
      .add {
        width: 38px;
        height: 38px;
        font-size: 24px;
      }
      .floating-cart {
        top: 14px;
        left: 14px;
        width: 54px;
        height: 54px;
      }
      .cart-sheet {
        max-height: 92vh;
      }
      .cart-list {
        padding: 0 14px;
      }
      .delivery {
        grid-template-columns: 1fr;
        padding: 15px 14px 10px;
      }
      .fee {
        margin: 0 14px 15px;
      }
      .totalbar {
        padding: 15px 14px;
      }
      .cart-item {
        grid-template-columns: 58px 1fr 32px;
        gap: 9px;
      }
      .cart-item img {
        width: 58px;
        height: 58px;
      }
      .cart-item .trash {
        grid-column: 3;
        grid-row: 1 / 3;
      }
      .logo-placeholder {
        width: 58px;
        height: 58px;
      }
    }
  </style>
</head>

  <header class="header">
    <div class="brand">
      <div>
        <h1>لقمة بلدنا</h1>
        <p>طعام لذيذ.. تجربة لا تُنسى</p>
      </div>
      <div class="logo-placeholder" aria-label="مكان شعار المطعم"></div>
    </div>
  </header>

  <nav class="categories" id="categories"></nav>

  <div class="search">
    <div class="searchbox">
      <input id="search" placeholder="إبحث عن صنف...">
      <span>⌕</span>
    </div>
  </div>

  <main class="page">
    <div class="grid" id="products"></div>
  </main>

  <button class="floating-cart" onclick="openCart()">
    🛒<span class="cart-count" id="cartCount">0</span>
  </button>

  <div class="overlay" id="overlay" onclick="closeCart()"></div>

  <section class="cart-sheet" id="cartSheet">
    <div class="handle"></div>
    <div class="cart-head">
      <h2>سلة الطلبات <span id="cartTitleCount">(0)</span></h2>
      <button class="close" onclick="closeCart()">×</button>
    </div>
    <div class="cart-list" id="cartList"></div>

    <div class="delivery">
      <button class="choice selected" id="pickup" onclick="setMethod('pickup')">
        🏪  الاستلام من الفرع  <span class="check">✓</span>
      </button>
      <button class="choice" id="delivery" onclick="setMethod('delivery')">
        🛵 توصيل <span class="check"></span>
      </button>
    </div>

    <div class="fee" id="deliveryFee" style="display:none">
      رسوم التوصيل: <b> 10 ريال</b>
    </div>

    <div class="totalbar">
      <div>الإجمالي<br><small>(شامل الضريبة)</small></div>
      <strong id="grandTotal">0 ر.س</strong>
      <button class="checkout" onclick="checkout()">إتمام الطلب</button>
    </div>
  </section>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>بيانات إتمام الطلب</h3>
      <div class="field">
        <label>الاسم الكامل</label>
        <input id="name" placeholder="أدخل اسمك الكامل">
      </div>
      <div class="field">
        <label>رقم الجوال</label>
        <input id="phone" placeholder="05xxxxxxxx">
      </div>
      <div class="location" id="location">
        <div class="field">
          <label>موقع التوصيل</label>
          <textarea id="address" placeholder="أدخل العنوان أو موقع التوصيل"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="cancel" onclick="closeModal()">إلغاء</button>
        <button class="send" onclick="sendOrder()">إرسال الطلب عبر واتساب</button>
      </div>
    </div>
  </div>

    const STORAGE_PRODUCTS = "restaurantProducts";
    const STORAGE_CATEGORIES = "restaurantCategories";

    let products = JSON.parse(localStorage.getItem(STORAGE_PRODUCTS) || "null");
    let categories = JSON.parse(localStorage.getItem(STORAGE_CATEGORIES) || "null");

    if (!Array.isArray(products) || products.length === 0) {
      products = DEFAULT_PRODUCTS;
    }

    if (!Array.isArray(categories) || categories.length === 0) {
      categories = [...MENU_CATEGORIES];
    }

    /* إعادة ضبط الأقسام القديمة حتى تظهر الأقسام المطلوبة */
    categories = [...MENU_CATEGORIES];
    localStorage.setItem(STORAGE_CATEGORIES, JSON.stringify(categories));

    /* المشاوي هو القسم المحدد عند فتح الصفحة */
    let activeCategory = "المشاوي";

    /* رقم واتساب المطعم */
    const RESTAURANT_WHATSAPP = "966572303810";

    let cart = [];
    let method = "pickup";

    /* =========================================================
       عرض الأصناف
       ========================================================= */
    function renderProducts(list = products) {
      const container = document.getElementById("products");

      container.innerHTML = list.map(product => `
        <article class="card">
          <button class="favorite">♡</button>
          <img src="${product[4]}" alt="${product[1]}">
          <div class="cardbody">
            <h3>${product[1]}</h3>
            <div class="cardrow">
              <span class="price">${product[2]} ر.س</span>
              <button class="add" onclick="add(${product[0]})">+</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    /* =========================================================
       عرض الأقسام
       ========================================================= */
    function renderCategories() {
      const container = document.getElementById("categories");

      container.innerHTML = categories.map(category => `
        <button
          class="cat ${category === activeCategory ? "active" : ""}"
          onclick="selectCategory('${category}')"
        >
          ${category}
        </button>
      `).join("");
    }

    /* =========================================================
       اختيار القسم
       ========================================================= */
    function selectCategory(category) {
      activeCategory = category;
      renderCategories();

      const searchText = document.getElementById("search").value.trim();

      const filteredProducts = products.filter(product => {
        const sameCategory = product[3] === category;
        const matchesSearch = searchText === "" || product[1].includes(searchText);
        return sameCategory && matchesSearch;
      });

      renderProducts(filteredProducts);
    }

    /* =========================================================
       السلة والطلبات
       ========================================================= */
    function add(id) {
      let x = cart.find(a => a.id === id);
      x ? x.q++ : cart.push({ id, q: 1 });
      renderCart();
    }

    function remove(id) {
      cart = cart.filter(x => x.id !== id);
      renderCart();
    }

    function change(id, d) {
      let x = cart.find(a => a.id === id);
      if (x) {
        x.q += d;
        if (x.q <= 0) remove(id);
        else renderCart();
      }
    }

    function renderCart() {
      let count = cart.reduce((s, x) => s + x.q, 0);
      let sub = cart.reduce((s, x) => s + products.find(p => p[0] === x.id)[2] * x.q, 0);

      document.getElementById("cartCount").textContent = count;
      document.getElementById("cartTitleCount").textContent = "(" + count + ")";

      document.getElementById("cartList").innerHTML = cart.length
        ? cart.map(x => {
            let p = products.find(p => p[0] === x.id);
            return `
              <div class="cart-item">
                <img src="${p[4]}">
                <div>
                  <h4>${p[1]}</h4>
                  <div class="price">${p[2]} ر.س</div>
                  <div class="qty">
                    <button onclick="change(${p[0]}, -1)">−</button>
                    <span>${x.q}</span>
                    <button onclick="change(${p[0]}, 1)">+</button>
                  </div>
                </div>
                <button class="trash" onclick="remove(${p[0]})">🗑️</button>
              </div>`;
          }).join("")
        : "<div style='padding:35px;text-align:center;color:#888'>السلة فارغة</div>";

      document.getElementById("grandTotal").textContent = (sub + (method === "delivery" ? 10 : 0)) + " ر.س";
    }

    function openCart() {
      document.getElementById("cartSheet").classList.add("open");
      document.getElementById("overlay").classList.add("open");
    }

    function closeCart() {
      document.getElementById("cartSheet").classList.remove("open");
      document.getElementById("overlay").classList.remove("open");
    }

    function setMethod(m) {
      method = m;
      document.getElementById("pickup").classList.toggle("selected", m === "pickup");
      document.getElementById("delivery").classList.toggle("selected", m === "delivery");
      document.querySelector("#pickup .check").textContent = m === "pickup" ? "✓" : "";
      document.querySelector("#delivery .check").textContent = m === "delivery" ? "✓" : "";
      document.getElementById("deliveryFee").style.display = m === "delivery" ? "block" : "none";
      renderCart();
    }

    function checkout() {
      if (!cart.length) return alert("السلة فارغة");
      document.getElementById("location").classList.toggle("open", method === "delivery");
      document.getElementById("modalOverlay").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("open");
    }

    function sendOrder() {
      let n = document.getElementById("name").value.trim();
      let p = document.getElementById("phone").value.trim();
      let a = document.getElementById("address").value.trim();

      if (!n || !p || (method === "delivery" && !a)) {
        return alert("يرجى إدخال البيانات المطلوبة");
      }

      let rows = cart.map(x => {
        let z = products.find(p => p[0] === x.id);
        return `- ${z[1]} × ${x.q} = ${z[2] * x.q} ر.س`;
      }).join("\n");

      let sub = cart.reduce((s, x) => s + products.find(p => p[0] === x.id)[2] * x.q, 0);
      let fee = method === "delivery" ? 10 : 0;

      let msg = `طلب جديد \n\nاسم العميل: ${n}\n رقم الجوال : ${p}\nطريقة الطلب : ${method === "delivery" ? "توصيل" : " استلام من الفرع "}\n${method === "delivery" ? "موقع العميل : " + a + "\n" : ""}\n تفاصيل الطلب:\n${rows}\n\nالمجموع: ${sub} ر.س\nرسوم التوصيل: ${fee} ر.س\nالإجمالي: ${sub + fee} ر.س`;

      window.open("https://wa.me/" + RESTAURANT_WHATSAPP + "?text=" + encodeURIComponent(msg), "_blank");
      closeModal();
    }

    /* =========================================================
       إعداد أحداث البحث والتشغيل الأولي
       ========================================================= */
    document.getElementById("search").addEventListener("input", () => {
      selectCategory(activeCategory);
    });

    renderCategories();
    selectCategory(activeCategory);
    renderCart();
  </script>
